name: Astarte end-to-end build

on:
  workflow_call:

env:
  elixir_version: "1.15"
  otp_version: "26.1"

jobs:
  end-to-end-build:
    name: End-to-end build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v2
      - uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build repo name env variable (job-scoped)
        run: |
          echo "REPO_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - name: Build branch slug env variable (job-scoped)
        run: |
          # Slugify branch/tag name for Docker tag safety and consistency
          echo "BRANCH_SLUG=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_.-]/-/g')" >> $GITHUB_ENV
      - name: Build Astarte E2E
        uses: docker/build-push-action@v6
        with:
          context: tools/astarte_e2e
          tags: astarte-e2e
          outputs: type=docker,dest=${{ runner.temp }}/astarte-e2e.tar
          build-args: BUILD_ENV=dev
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_NAME }}:astarte_e2e-${{ env.BRANCH_SLUG }},scope=astarte_e2e-${{ env.BRANCH_SLUG }}
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_NAME }}:astarte_e2e-${{ env.BRANCH_SLUG }},mode=max,scope=astarte_e2e-${{ env.BRANCH_SLUG }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: astarte-e2e-image
          path: ${{ runner.temp }}/astarte-e2e.tar
